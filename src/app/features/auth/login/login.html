<div class="login-container">

  <mat-card>

    <h2>Stress Monitor</h2>

    <form (ngSubmit)="login()">

      <mat-form-field appearance="outline">

        <mat-label>Email</mat-label>

        <input
          matInput
          type="email"
          [(ngModel)]="loginRequest.email"
          name="email"
        >

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>Password</mat-label>

        <input
          matInput
          type="password"
          [(ngModel)]="loginRequest.password"
          name="password"
        >

      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
      >
        Login
      </button>

    </form>

  </mat-card>

</div>
